all: false
dir: "internal/testing/mocks"
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: true
log-level: info
structname: "{{.InterfaceName}}"
pkgname: "mocks"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
inpackage: false
packages:
  github.com/prawirdani/golang-restapi/internal/repository:
    interfaces:
      Transactor:
        config:
          filename: transactor.go

  github.com/prawirdani/golang-restapi/internal/storage:
    interfaces:
      Storage:
        config:
          filename: storage.go
      File:
        config:
          filename: storage_file.go

  github.com/prawirdani/golang-restapi/internal/throttle:
    interfaces:
      Throttler:
        config:
          filename: throttler.go

  github.com/prawirdani/golang-restapi/internal/auth:
    interfaces:
      Repository:
        config:
          dir: "./internal/auth/mocks"
          structname: "{{.InterfaceName}}"
          filename: repository.go
      UserRepository:
        config:
          dir: "./internal/auth/mocks"
          structname: "{{.InterfaceName}}"
          filename: user_repository.go
      EventProducer:
        config:
          dir: "./internal/auth/mocks"
          structname: "{{.InterfaceName}}"
          filename: event_producer.go

  github.com/prawirdani/golang-restapi/internal/user:
    interfaces:
      Repository:
        config:
          dir: "./internal/user/mocks"
          structname: "{{.InterfaceName}}"
          filename: repository.go
